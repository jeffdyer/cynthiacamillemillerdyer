<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cynthia Camille Miller Dyer</title>
    <meta name="description" content="In memory of Cynthia Camille Miller Dyer, 1934 - 2015.">

    <meta property="og:title" content="Cynthia Camille Miller Dyer">
    <meta property="og:description" content="1934 - 2015">
    <meta property="og:type" content="website">
    <meta property="og:image" content="parents-walking.jpg">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 28Q6 6 28 4Q26 26 4 28Z' fill='%23517e61'/%3E%3Cpath d='M7 25Q16 16 25 7' stroke='%233c604a' stroke-width='1.2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
    <style>
      :root {
        /* Sampled from the photograph: #517e61 canopy, #568a63 lit green,
           #99b0c5 the path. Deeper up top, paling toward the bottom. */
        --bg-top: #9fb8a8;
        --bg-bottom: #dae4dd;
        --ink: #2b4435;
        --shadow: 26, 52, 36;
        --card: #f9f7f1;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        min-height: 100vh;
        min-height: 100dvh; /* accounts for mobile browser chrome */
        padding: 2.5rem 1.25rem;
        /* Foliage echoing the canopy in the photograph - overlapping leaves in
           greens sampled from the image itself. It sits behind the card, so the
           texture reads around the photograph, never over it. */
        background-image: url('leaves.png'),
                          linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
        background-repeat: repeat, no-repeat;
        background-position: center, center;
        color: var(--ink);
        font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        max-width: min(430px, 100%);
        padding: 1.5rem 1.5rem 1.75rem;
        background: var(--card);
        border-radius: 4px;
        box-shadow:
          0 1px 2px rgba(var(--shadow), 0.12),
          0 18px 48px rgba(var(--shadow), 0.28);
        text-align: center;
        animation: rise 1.4s ease-out both;
      }

      .photo {
        display: block;
        width: 100%;
        max-height: min(48vh, 500px);
        object-fit: contain;
        margin: 0 auto;
        border: 1px solid rgba(var(--shadow), 0.28);
      }

      .name {
        margin: 1.25rem 0 0;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 1.4rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: #333;
      }

      .dates {
        margin: 0.45rem 0 0;
        font-family: Helvetica, Arial, sans-serif;
        /* Matched to .name.second, so the primary dates sit at the same size
           as the other parent's name below them. */
        font-size: 1.05rem;
        color: #555;
      }

      .together {
        margin: 0.9rem 0 0;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 0.875rem;
        font-style: italic;
        color: #5a5a5a;
      }

      .name.second {
        margin-top: 1rem;
        font-size: 1.05rem;
        color: #5a5a5a;
      }

      .dates.second-dates {
        /* The other parent's dates stay at the old size, so enlarging the
           primary line above does not drag this one up with it. */
        font-size: 0.9375rem;
        color: #6b6b6b;
      }

      .name.second a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .rule {
        width: 62%;
        margin: 1.1rem auto 0;
        border: 0;
        border-top: 1px solid rgba(var(--shadow), 0.22);
      }

      footer {
        max-width: 34rem;
        text-align: center;
        line-height: 1.7;
        animation: rise 1.4s ease-out 0.35s both;
      }

      footer p {
        margin: 0;
      }

      .memory {
        font-size: 1.25rem;
        letter-spacing: 0.06em;
        opacity: 0.85;
      }

      .obit-link {
        margin-top: 0.75rem;
      }

      .obit-link a {
        font-family: Helvetica, Arial, sans-serif;
        font-size: 0.9375rem;
        color: var(--ink);
        text-decoration: underline;
        text-underline-offset: 3px;
      }


      /* A speaker icon rather than words: it says the same thing in a quarter
         of the space, and the page has no other prose to match. */
      .music {
        display: block;
        margin: 1.1rem auto 0;
        padding: 0.3rem;
        border: 0;
        background: none;
        color: var(--ink);
        line-height: 0;
        opacity: 0.5;
        cursor: pointer;
        transition: opacity 0.3s ease;
      }

      .music:hover,
      .music:focus-visible { opacity: 0.85; }

      /* No box around it in any state. The opacity lift above is the whole
         affordance and it fires on focus as well as hover, so taking the ring
         off does not leave a keyboard user with nothing to go on.
         ::-moz-focus-inner is Firefox's own inner border on click, and the tap
         highlight is the grey block iOS paints over a tapped control. */
      .music:focus,
      .music:focus-visible { outline: none; }
      .music::-moz-focus-inner { border: 0; }
      .music { -webkit-tap-highlight-color: transparent; }

      .music-icon { width: 20px; height: 20px; }
      .music-icon .spk { fill: currentColor; }
      .music-icon .waves,
      .music-icon .slash { fill: none; stroke: currentColor; }

      /* Silent shows a cross where the waves would be, playing shows the
         waves. A cross rather than a line struck through the whole glyph:
         both are conventional, but a struck-through line crosses the filled
         speaker body and would need knocking out against a gradient that
         changes down the page. The cross sits in empty space and stays
         legible on any background. The button's aria-pressed drives which
         half shows, so there is one source of truth. */
      .music[aria-pressed="false"] .waves,
      .music[aria-pressed="true"] .slash { display: none; }

      /* A hairline that fills as the recording plays, and is not there at
         all otherwise. Opacity rather than display, so the footer does not
         reflow when it comes and goes. */
      .progress {
        width: min(190px, 55%);
        height: 2px;
        margin: 0.6rem auto 0;
        border-radius: 1px;
        background: rgba(var(--shadow), 0.16);
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.6s ease;
      }

      .progress.on { opacity: 1; }

      .progress-fill {
        display: block;
        width: 0;
        height: 100%;
        background: var(--ink);
        opacity: 0.5;
        /* timeupdate only fires a few times a second; this carries the bar
           between ticks so it creeps rather than steps. */
        transition: width 0.25s linear;
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .card, footer { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="photo" src="parents-walking.jpg" alt="Cynthia Camille Miller Dyer walking arm in arm with Norman Hill Dyer along a wooded path, September 2010.">
      <h1 class="name">Cynthia Camille Miller Dyer</h1>
      <p class="dates">1934 &ndash; 2015</p>
      <p class="name second"><a href="https://normanhilldyer.org">Norman Hill Dyer</a></p>
      <p class="dates second-dates">1931 &ndash; 2026</p>
      <hr class="rule">
      <p class="together">Together again</p>
    </main>

    <footer>
      <p class="memory">In loving memory</p>
      <p class="obit-link"><a href="obituary.html">Read her obituary</a></p>
      <button class="music" type="button" aria-pressed="false" aria-label="Play music">
        <svg class="music-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path class="spk" d="M1.8 6h2.7L8 3.1v9.8L4.5 10H1.8z"/>
          <g class="waves" stroke-width="1.35" stroke-linecap="round">
            <path d="M10.4 5.9a3.2 3.2 0 0 1 0 4.2"/>
            <path d="M12.5 4.1a6 6 0 0 1 0 7.8"/>
          </g>
          <g class="slash" stroke-width="1.5" stroke-linecap="round">
            <path d="M10.7 5.9l3.9 3.9"/>
            <path d="M14.6 5.9l-3.9 3.9"/>
          </g>
        </svg>
      </button>
      <div class="progress" aria-hidden="true"><span class="progress-fill"></span></div>
    </footer>

    <!-- preload="none" so a visitor who never asks for music never downloads
         it, and no autoplay attribute anywhere. It plays once rather than
         looping. -->
    <audio class="music-track" preload="none">
      <source src="look-to-the-rainbow.m4a" type="audio/mp4">
    </audio>

    <script>
      /* Background music, off until asked for.

         It plays through a Web Audio graph rather than straight out of the
         element. Two reasons: the transfer is quiet - it peaks at -5.5 dBFS
         and sits near -21 dB RMS - and audio.volume cannot go above 1.0, so
         there was no way to lift it from there; and the graph gives the
         surface noise somewhere to mix in. Volume is ramped by hand at both
         ends, since an abrupt cut is jarring in a quiet room. */
      (function () {
        var btn = document.querySelector('.music');
        var audio = document.querySelector('.music-track');
        var bar = document.querySelector('.progress');
        var fill = document.querySelector('.progress-fill');
        if (!btn || !audio) return;

        /* Measured against the actual transfer rather than guessed: at 1.5
           the mix peaks at -1.3 dBFS across the whole track with no clipped
           samples, and the crackle lands about 21 dB under the music - present
           in a quiet room, never competing with her song. */
        var MUSIC_GAIN = 1.5;
        var CRACKLE_GAIN = 0.9;
        var FALLBACK_LEVEL = 1;   /* no graph: the element's ceiling is all there is */

        var playing = false;
        var fade, fadeEnd;
        var ctx, master, crackleGain;

        function clearFade() { clearInterval(fade); clearTimeout(fadeEnd); }

        /* Vinyl surface noise, generated rather than shipped: a bed of
           filtered hiss with pops scattered through it, looped under the
           music. Ten seconds because a shorter loop starts to read as a
           pattern, and nothing starts in the last 20ms so the seam never
           cuts a pop in half. */
        function makeCrackle() {
          var secs = 10, n = Math.floor(ctx.sampleRate * secs);
          var buf = ctx.createBuffer(1, n, ctx.sampleRate);
          var d = buf.getChannelData(0);
          for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * 0.02;

          var safe = n - Math.floor(ctx.sampleRate * 0.02);
          var pops = Math.round(secs * 9);
          for (var p = 0; p < pops; p++) {
            var at = Math.floor(Math.random() * safe);
            var amp = (0.08 + Math.random() * 0.42) * (Math.random() < 0.5 ? -1 : 1);
            var len = Math.max(2, Math.round(ctx.sampleRate * (0.001 + Math.random() * 0.003)));
            for (var k = 0; k < len && at + k < n; k++) {
              d[at + k] += amp * Math.exp(-k / (len * 0.35));
            }
          }

          var src = ctx.createBufferSource();
          src.buffer = buf;
          src.loop = true;

          /* Rolling off the bottom keeps it surface noise rather than rumble,
             and trimming the top stops it hissing like tape. */
          var hp = ctx.createBiquadFilter();
          hp.type = 'highpass';
          hp.frequency.value = 700;
          var lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.value = 8000;

          var g = ctx.createGain();
          g.gain.value = CRACKLE_GAIN;
          src.connect(hp); hp.connect(lp); lp.connect(g);
          src.start();
          return g;
        }

        /* Built on the first play and not before: a context created outside a
           user gesture starts suspended, and routing an element into a graph
           is a one-way move, so it happens once and is kept. Any failure here
           falls back to the bare element rather than leaving a silent page. */
        function buildGraph() {
          if (ctx) return true;
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return false;
          try {
            ctx = new AC();
            var src = ctx.createMediaElementSource(audio);
            var music = ctx.createGain();
            music.gain.value = MUSIC_GAIN;
            master = ctx.createGain();
            master.gain.value = 0;
            src.connect(music);
            music.connect(master);
            crackleGain = makeCrackle();
            crackleGain.connect(master);
            master.connect(ctx.destination);
            return true;
          } catch (e) {
            ctx = master = crackleGain = null;
            return false;
          }
        }

        /* One ramp for both paths. Through the graph it moves the master, so
           music and crackle come up and go down together. */
        function ramp(to, ms, done) {
          clearFade();
          if (master) {
            var g = master.gain, t = ctx.currentTime;
            g.cancelScheduledValues(t);
            g.setValueAtTime(g.value, t);
            g.linearRampToValueAtTime(to, t + ms / 1000);
            if (done) fadeEnd = setTimeout(done, ms);
            return;
          }
          var from = audio.volume, t0 = Date.now();
          fade = setInterval(function () {
            var k = Math.min(1, (Date.now() - t0) / ms);
            audio.volume = from + (to - from) * k;
            if (k === 1) { clearFade(); if (done) done(); }
          }, 40);
        }

        /* Every control and label reads off `playing`, so the ended handler
           can put things back simply by clearing it and calling this. */
        function render() {
          btn.setAttribute('aria-pressed', playing ? 'true' : 'false');
          btn.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
          if (bar) bar.classList.toggle('on', playing);
        }

        /* Duration is NaN until metadata arrives, and preload is none, so it
           is genuinely absent until the first play. */
        audio.addEventListener('timeupdate', function () {
          if (!fill || !playing) return;
          var d = audio.duration;
          if (!d || d !== d) return;
          fill.style.width = Math.min(100, (audio.currentTime / d) * 100) + '%';
        });

        function toggle() {
          playing = !playing;
          render();
          if (!playing) {
            ramp(0, 900, function () {
              audio.pause();
              /* Nothing should be left running once the page is quiet. */
              if (ctx && ctx.suspend) ctx.suspend();
            });
            return;
          }
          var routed = buildGraph();
          if (ctx && ctx.state === 'suspended') ctx.resume();
          if (!routed) audio.volume = 0;
          var started = audio.play();
          ramp(routed ? 1 : FALLBACK_LEVEL, 2000);
          if (started && started.catch) started.catch(fail);
        }

        /* Playback can stop without our asking: the recording runs out, or
           the browser interrupts it. Either way the control has to come back
           to offering it rather than sitting there showing sound.

           render() runs BEFORE the rewind, because seeking an element that
           has just ended throws in some browsers and the throw would take
           the icon update down with it. The seek is last and guarded, so it
           cannot take anything with it if it fails.

           Guarding on `playing` keeps our own fade-out from tripping this:
           there the flag is already false, so it returns before touching
           anything and the paused position is kept. */
        function stopped(rewind) {
          clearFade();
          if (!playing) return;
          playing = false;
          render();
          if (rewind) {
            try { audio.currentTime = 0; } catch (e) {}
            if (fill) fill.style.width = '0';   /* masked by the bar fading out */
          }
        }
        audio.addEventListener('ended', function () { stopped(true); });
        audio.addEventListener('pause', function () { stopped(false); });

        btn.addEventListener('click', toggle);

        /* play() rejects for reasons that have nothing to do with the file -
           an autoplay policy, or a pause arriving while the play is still
           settling. Those should leave the control alone to be tried again.
           Only a real media error earns having it taken away, so that a
           file which will not play leaves no dead control behind. */
        function fail() {
          clearFade();
          playing = false;
          render();
          if (!audio.error) return;
          btn.remove();
          if (bar) bar.remove();
        }
        audio.addEventListener('error', fail);
      })();
    </script>
  </body>
</html>
